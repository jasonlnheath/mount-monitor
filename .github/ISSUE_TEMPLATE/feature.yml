name: Feature request
description: Something you would like Mount Monitor to do.
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: What you want
      description: The behavior you are after, and why.
      placeholder: Rings for network mounts too.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do instead today
      description: Optional.
